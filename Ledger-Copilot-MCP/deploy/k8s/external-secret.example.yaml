# Example only — rename to external-secret.yaml and fill in your vault's
# details to use. Requires the External Secrets Operator
# (https://external-secrets.io) installed on the cluster, with a
# SecretStore/ClusterSecretStore already configured for Azure Key Vault
# (workload identity or a service-principal secret — see ESO's Azure
# provider docs). Once applied, this generates the same
# `ledger-copilot-secrets` Secret that secret.yaml's placeholder defines, so
# deployment.yaml's `envFrom: secretRef` needs no change — ESO keeps the
# Secret's values in sync with the named Key Vault secrets going forward.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ledger-copilot-secrets
  labels:
    app: ledger-copilot
spec:
  secretStoreRef:
    name: azure-key-vault
    kind: ClusterSecretStore
  target:
    name: ledger-copilot-secrets
  refreshInterval: 1h
  data:
    - secretKey: LEDGER_COPILOT_VENDOR_RISK_API_KEY
      remoteRef:
        key: ledger-copilot-vendor-risk-api-key
    - secretKey: LEDGER_COPILOT_AUTH_JWKS_URI
      remoteRef:
        key: ledger-copilot-auth-jwks-uri
    - secretKey: LEDGER_COPILOT_AUTH_ISSUER
      remoteRef:
        key: ledger-copilot-auth-issuer
    - secretKey: LEDGER_COPILOT_AUTH_AUDIENCE
      remoteRef:
        key: ledger-copilot-auth-audience
