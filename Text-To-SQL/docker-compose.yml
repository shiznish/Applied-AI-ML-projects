services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: text2sql
      POSTGRES_PASSWORD: text2sql
      POSTGRES_DB: text2sql
    ports:
      - "5432:5432"
    volumes:
      - text2sql_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U text2sql"]
      interval: 5s
      timeout: 5s
      retries: 10

  # OTLP-native trace backend — accepts spans directly, no separate OTel
  # Collector needed for a project this size. UI at http://localhost:16686.
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

volumes:
  text2sql_pgdata:
