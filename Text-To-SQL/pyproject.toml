[project]
name = "text2sql"
version = "0.1.0"
description = "Enterprise-oriented text-to-SQL platform: schema retrieval/linking, semantic layer, PostgreSQL RLS, RBAC, audit, OTel."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "asyncpg>=0.29",
    "sqlglot>=25.0",
    "anthropic>=0.95",
    "openai>=1.40",
    "boto3>=1.34",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyjwt>=2.9",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-asyncpg>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1",
    # langgraph-checkpoint-postgres pulls in plain `psycopg`, which needs the
    # native libpq client library present on the system to import at all —
    # fine on a dev machine that happens to already have it, but not in a
    # clean container (see Dockerfile). The [binary] extra ships a
    # self-contained wheel with libpq bundled in, so no system package is
    # needed anywhere this runs.
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
